<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
{{HEAD}}
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#catalog">跳到软件列表</a>

<header class="masthead">
  <div class="mast-main">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="wordmark">HRX 软件库</span>
      <span class="tagline">本机运行 · 不上传 · 绿色免安装</span>
    </div>
    <p class="brief">{{DESC}}</p>
  </div>
  <figure class="contact">
    <img class="qr" src="images/wechat-qr.png" alt="HRX 微信公众号二维码" width="258" height="258">
    <figcaption>
      <b>微信公众号 · HRX 软件库</b>
      <span>想要哪个工具还没做？扫码提需求，也可以谈定制开发。</span>
      <em class="scan-hint">长按二维码即可识别</em>
    </figcaption>
  </figure>
</header>

<section class="toolbar" aria-label="检索与筛选">
  <div class="search">
    <label class="sr-only" for="q">按名称、功能或关键词检索</label>
    <input id="q" type="search" placeholder="搜索软件名或功能，例如 PDF 合并、去水印、剪贴板" autocomplete="off"
           spellcheck="false" accesskey="s">
    <button class="clear" type="button" id="clear" hidden aria-label="清空搜索">✕</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="按分类筛选">{{CHIPS}}</div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</section>

<main id="catalog" class="catalog">{{CARDS}}
</main>

<div class="empty" id="empty" hidden>
  <p class="empty-title">没有匹配的软件</p>
  <p class="empty-hint">试试这些词：<span id="suggest"></span></p>
  <figure class="contact contact-inline">
    <img class="qr" src="images/wechat-qr.png" alt="HRX 微信公众号二维码" width="258" height="258" loading="lazy">
    <figcaption>
      <b>没找到想要的工具？</b>
      <span>扫码说说你的需求，可以定制开发；公众号也会第一时间推送新工具。</span>
    </figcaption>
  </figure>
</div>

<dialog id="detail" aria-labelledby="detail-name">
  <article class="sheet">
    <header class="sheet-head">
      <div>
        <h2 id="detail-name"></h2>
        <p id="detail-sub"></p>
      </div>
      <button class="close" type="button" id="detail-close" aria-label="关闭详情">✕</button>
    </header>
    <img id="detail-cover" alt="" hidden>
    <p id="detail-desc"></p>
    <ul id="detail-features"></ul>
    <div class="sheet-meta" id="detail-meta"></div>
    <div class="sheet-cta" id="detail-cta"></div>
    <p class="note">下载后解压即用；软件全部在你自己的电脑上运行，不需要联网。</p>
  </article>
</dialog>

<footer class="foot">
  <div class="foot-text">
    <p>共 {{COUNT}} 款软件 · 数据更新于 {{UPDATED}} · 内容维护：{{MAINTAINER}}</p>
    <p class="fine">所列工具均为个人开发的 Windows 桌面软件，免费获取、离线运行。只列出已经挂出下载链接的软件，其余做好后陆续上架。</p>
  </div>
  <figure class="contact contact-foot">
    <img class="qr" src="images/wechat-qr.png" alt="HRX 微信公众号二维码" width="258" height="258" loading="lazy">
    <figcaption>
      <b>微信公众号 · HRX 软件库</b>
      <span>扫码关注更新，需要定制开发也可以扫码聊。</span>
    </figcaption>
  </figure>
</footer>

<script type="application/json" id="shares-data">{{DATA}}</script>
<script src="app.js"></script>
</body>
</html>
