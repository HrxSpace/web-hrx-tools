slug: 006_图片去除水印工具
kind: soft
name: 图片去水印
name_en: WatermarkRemover
exe_name: 图片去水印
status: live
category: 图片处理
summary: 本地 AI 图片修复：涂抹水印区域，一键修复成自然画面
description: 图片去水印是一款本地运行的图片修复工具：打开一张带水印的图片，用鼠标把水印涂出来，AI 会自动把涂抹的区域修复成自然的画面，最后另存为新图片。整个过程在你的电脑上完成，图片不会被上传到任何服务器。 典型场景：去掉照片上的文字水印、Logo、日期戳，或抹掉画面里不想要的小物件。
features:
- 全程本地处理：AI 修复模型就在你的电脑上，图片不上传，断网也能用；状态栏会显示当前用的计算引擎
- 一键去水印：涂抹水印区域，AI 自动修复成自然画面
- 批量去水印：整批图片位置相同的水印，涂一次蒙版全部套用；也支持逐张涂抹
- 快速预览：正式处理前先看修复效果，不满意可以继续调整
- 灵活涂抹：左键涂抹、右键擦除，笔刷大小和边缘柔和度都可调
- 画布缩放平移：滚轮缩放、中键拖动，小水印也能涂得精准
- 撤销与重做：涂错了随时回退，也可一键清空全部涂抹
- 多种格式：支持打开 png / jpg / webp / bmp / ico / icns，保存为 png / jpg / webp / bmp
- 自动命名：保存时自动加时间戳，不会覆盖你的原图
- 个性化：12 个快捷键全部可以自定义
- 自动选设备：有 NVIDIA 显卡时走显卡，没有则用 CPU，功能一样完整
