description: AI缓存专清是一款专门清理 AI 编程终端和包管理器残留的 Windows 桌面工具。它会把 Claude Code、Codex、Cursor、ZCode、Kimi、豆包、Qoder、TRAE 等 AI 工具留下的缓存、日志、会话历史、配置和更新包列成一张清单，按安全等级分类，让你先看清再决定删什么。 它适合经常使用 AI 编程工具、C 盘空间越来越紧张，但又担心“删错文件”的人。软件坚持三条原则：只清理本机、只读文件名/大小/修改时间（不打开文件内容）、不联网。
features:
- 扫描 AI 终端残留：自动找出用户目录和 AppData 里的 AI 工具缓存
- 四级安全分级：S（可放心清理）、A（需要确认）、B（默认保护）、C（禁止清理），凭据和程序本体永远不能删
- 清理前先试算：列出本次要删多少项、大概能回收多少、哪些会先归档
- 直接删除并明确提示：删除不经过系统回收站，每次都会弹出三条固定警示
- 归档与还原：会话历史和配置在删除前会先复制到归档区
- 清理记录：每次清理都留下一条记录，写清估算回收、实际释放
- 瘦身建议：只读提示哪些终端很久没用、哪个文件特别大、哪些缓存占用高。
- SKILL/AGENT 盘点：把技能、命令、插件、规范文件列清楚，只看不动。
- 设置与报告：可调整归档保留天数、扫描线程数等；清理后可导出 JSON/CSV 报告。
